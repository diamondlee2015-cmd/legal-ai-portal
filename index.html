<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>VitalsTrack Legal - 智能合同风控终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <!-- 头部安全栏 -->
    <header class="border-b border-slate-800 px-6 py-4 flex justify-between items-center bg-slate-950">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wide text-blue-400">VitalsTrack</span>
            <span class="text-xs bg-blue-950 text-blue-300 border border-blue-800 px-2 py-0.5 rounded">Legal Edition</span>
        </div>
        <div class="text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800/50 px-3 py-1 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Zero-Training Cloud Encrypted
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-12 gap-6">
        <!-- 上传与输入区 -->
        <div class="col-span-12 bg-slate-800/50 border border-slate-700/50 rounded-xl p-6">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">提交审阅合同文本 / 卷宗</h2>
            <textarea id="contractText" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-200" placeholder="粘贴合同条款或离职竞业限制协议..."></textarea>
            <div class="mt-4 flex justify-end">
                <button onclick="analyzeContract()" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition-all flex items-center gap-2">
                    🚀 开始 AI 判例风险审查
                </button>
            </div>
        </div>

        <!-- 双栏结果渲染区 -->
        <div class="col-span-12 grid grid-cols-2 gap-6 hidden" id="resultContainer">
            <!-- 左栏：原文条款 -->
            <div class="bg-slate-800/30 border border-slate-800 rounded-xl p-5">
                <h3 class="text-xs font-semibold text-slate-400 mb-3 border-b border-slate-800 pb-2">📄 分析条款原文</h3>
                <div id="sourceView" class="text-sm leading-relaxed text-slate-300"></div>
            </div>
            <!-- 右栏：AI 合规风控与依据 -->
            <div class="bg-slate-800/30 border border-slate-800 rounded-xl p-5">
                <h3 class="text-xs font-semibold text-slate-400 mb-3 border-b border-slate-800 pb-2">⚖️ AI 法务审查建议 (含普通法依据)</h3>
                <div id="aiAnalysisView" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        async function analyzeContract() {
            const text = document.getElementById('contractText').value;
            if(!text) return alert('请先输入合同内容');
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "⏳ 正在检索新马判例库并审查...";
            btn.disabled = true;

            try {
                // 替换为你的 n8n Webhook 地址
                const response = await fetch('https://YOUR-N8N-INSTANCE.com/webhook/legal-audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contract_text: text })
                });
                
                const data = await response.json();
                
                // 渲染结果
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('sourceView').innerText = text;
                document.getElementById('aiAnalysisView').innerHTML = `
                    <div class="bg-red-950/40 border border-red-800/50 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-red-400">🔴 高风险违规</span>
                            <span class="text-xs text-slate-400">匹配率: 98%</span>
                        </div>
                        <p class="text-sm text-slate-200 mt-1">${data.risk_summary || '竞业限制期过长且未约定对等经济补偿。'}</p>
                        <div class="mt-3 text-xs text-blue-400 bg-blue-950/50 p-2 rounded border border-blue-900">
                            <strong>判例依据：</strong> ${data.legal_citation || 'Singapore High Court [2024] SGHC 88'}
                        </div>
                    </div>
                `;
            } catch(e) {
                alert('审查请求发送失败，请检查 n8n 连通性');
            } finally {
                btn.innerHTML = "🚀 开始 AI 判例风险审查";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
