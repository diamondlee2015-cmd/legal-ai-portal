<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalsTrack Legal - AI Contract Audit Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <!-- Header -->
    <header class="border-b border-slate-800 px-6 py-4 flex justify-between items-center bg-slate-950">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wide text-blue-400">VitalsTrack</span>
            <span class="text-xs bg-blue-950 text-blue-300 border border-blue-800 px-2 py-0.5 rounded">Legal Edition</span>
        </div>
        <div class="text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800/50 px-3 py-1 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Zero-Training Cloud Encrypted (TLS 1.3)
        </div>
    </header>

    <!-- Main Canvas -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-12 gap-6">
        <!-- Input Section -->
        <div class="col-span-12 bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 shadow-xl">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Submit Contract Clause or Legal Brief</h2>
            <textarea id="contractText" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-200 font-mono" placeholder="Paste employment clause, Non-Compete Agreement (NCA), or M&A contract text here..."></textarea>
            <div class="mt-4 flex justify-between items-center">
                <span class="text-xs text-slate-500">Supported Jurisdiction: Singapore / Malaysia Common Law</span>
                <button onclick="analyzeContract()" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-6 py-2.5 rounded-lg transition-all flex items-center gap-2 shadow-lg shadow-blue-900/30">
                    🚀 Run AI Legal Risk Audit
                </button>
            </div>
        </div>

        <!-- Split View Results (Hidden by default) -->
        <div class="col-span-12 grid grid-cols-2 gap-6 hidden" id="resultContainer">
            <!-- Left: Original Source -->
            <div class="bg-slate-800/30 border border-slate-800 rounded-xl p-5">
                <h3 class="text-xs font-semibold text-slate-400 mb-3 border-b border-slate-800 pb-2 uppercase tracking-wider">📄 Clause Original Text</h3>
                <div id="sourceView" class="text-sm leading-relaxed text-slate-300 font-mono bg-slate-950/50 p-3 rounded border border-slate-800/80"></div>
            </div>
            <!-- Right: AI Compliance Audit -->
            <div class="bg-slate-800/30 border border-slate-800 rounded-xl p-5">
                <h3 class="text-xs font-semibold text-slate-400 mb-3 border-b border-slate-800 pb-2 uppercase tracking-wider">⚖️ AI Compliance & Precedent Analysis</h3>
                <div id="aiAnalysisView" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        async function analyzeContract() {
            const text = document.getElementById('contractText').value;
            if(!text) return alert('Please enter contract text first.');
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "⏳ Searching Common Law Precedents...";
            btn.disabled = true;

            try {
                // ⚠️ REPLACE THIS URL WITH YOUR ACTUAL N8N PRODUCTION WEBHOOK URL
                const response = await fetch('https://n8n.ougnv.site/webhook/legal-audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contract_text: text })
                });
                
                const data = await response.json();
                
                // Render Split View
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('sourceView').innerText = text;
                document.getElementById('aiAnalysisView').innerHTML = `
                    <div class="bg-red-950/40 border border-red-800/50 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-red-400 uppercase tracking-wide">🔴 High Legal Risk Detected</span>
                            <span class="text-xs text-slate-400">Confidence: 98%</span>
                        </div>
                        <p class="text-sm text-slate-200 mt-1 leading-relaxed">${data.risk_summary || 'The 3-year non-compete restraint period is likely unenforceable under SG/MY Common Law due to lack of financial consideration.'}</p>
                        <div class="mt-3 text-xs text-blue-300 bg-blue-950/60 p-2.5 rounded border border-blue-900/80 font-mono">
                            <strong>Relevant Precedent / Authority:</strong><br>${data.legal_citation || 'Singapore High Court [2024] SGHC 88 / Man Financial (S) Pte Ltd v Wong Bark Chuan'}
                        </div>
                    </div>
                `;
            } catch(e) {
                alert('Connection failed. Please verify your n8n webhook status.');
            } finally {
                btn.innerHTML = "🚀 Run AI Legal Risk Audit";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
